name: CalTodo
options:
  bundleIdPrefix: com.caltodo
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

targets:
  CalTodo:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - CalTodo
    dependencies:
      - package: Supabase
    settings:
      base:
        INFOPLIST_FILE: CalTodo/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.caltodo.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: ""
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    info:
      path: CalTodo/Info.plist
      properties:
        CFBundleDisplayName: caltodo
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - caltodo
            CFBundleURLName: com.caltodo.app
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        API_BASE_URL: $(API_BASE_URL)

  CalTodoTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - CalTodoTests
    dependencies:
      - target: CalTodo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caltodo.app.tests
        SWIFT_VERSION: "5.9"
