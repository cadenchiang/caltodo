name: CI

# Runs on pushes to main as well as PRs. Vercel deploys straight off main, so
# a direct push (or an admin merge that skips the PR flow) previously reached
# production with no typecheck and no tests behind it — on 2026-07-27 four
# such pushes shipped on local verification alone.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A PR branch that gets pushed again mid-run doesn't need the older run to
# finish. main is excluded from cancellation: every commit that reaches
# production should have its own recorded result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Typecheck & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run
