name: Migrate Database

# Modeled on the Pensive monorepo's db-migrate harness, adapted for Supabase.
# Applies pending Supabase migrations to the production database, with a
# preview-first flow:
#   - On merge to main touching supabase/migrations/** -> apply automatically.
#   - Manually (workflow_dispatch) -> defaults to a DRY RUN that previews
#     pending migrations without touching the database.
# The preview is written to the job summary so you can see exactly what will
# (or did) apply. `supabase db push` only applies migrations not yet recorded
# in the project's schema_migrations table, so runs are idempotent.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  – personal access token
#                            (https://supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD   – production project database password
#   SUPABASE_PROJECT_REF   – project ref (<ref> in https://<ref>.supabase.co)

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        description: Preview pending migrations without applying
        default: true

# Never run two migration deploys against the database at once.
concurrency:
  group: db-migrate-prod
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations to production
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # A manual run honors its dry_run toggle (default true); an automatic
      # push-to-main run always applies.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - name: Guard — required secrets present
        run: |
          missing=0
          [ -n "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] || { echo "::error::Missing secret: SUPABASE_ACCESS_TOKEN"; missing=1; }
          [ -n "${{ secrets.SUPABASE_DB_PASSWORD }}" ]  || { echo "::error::Missing secret: SUPABASE_DB_PASSWORD"; missing=1; }
          [ -n "${{ secrets.SUPABASE_PROJECT_REF }}" ]  || { echo "::error::Missing secret: SUPABASE_PROJECT_REF"; missing=1; }
          [ "$missing" -eq 0 ]

      - uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to the production project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Preview pending migrations
        run: |
          echo "## Pending migrations" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # --dry-run prints the migrations that would be applied (or reports
          # the remote is up to date) without changing anything.
          supabase db push --dry-run 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Apply migrations
        if: ${{ env.DRY_RUN != 'true' }}
        run: supabase db push
